(function () {
  var v = new URLSearchParams(location.search).get('v');
  var movel = window.matchMedia('(max-width: 860px)').matches || (window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);

  location.replace(alvo);
})();
